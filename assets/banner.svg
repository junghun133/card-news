<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="card-news: AI가 뉴스를 요약해 카드뉴스와 영상으로 만드는 데스크톱 앱">
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .scan{animation:scan 2.8s ease-in-out infinite alternate}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--d,38px))}}
    @media (max-width: 560px){.aside{display:none}.cmd{font-size:20px}}
    @media (prefers-reduced-motion: reduce){.blink,.pulse,.scan{animation:none}}
  </style>
<rect x="0.5" y="0.5" width="839" height="199" rx="12" fill="#0B1626" stroke="#1B2B42"/>
<text x="42" y="92" class="sans" font-size="46" fill="#E6EEF7" font-weight="800" letter-spacing="-1">card-news</text>
<text x="44" y="130" class="sans" font-size="17" fill="#A3B4C9" >AI가 뉴스를 요약해 카드뉴스와 영상으로 만드는 데스크톱 앱</text>
<text x="44" y="166" class="mono" font-size="15" fill="#8296AE" ><tspan fill="#5CC8FF">$</tspan> npm run dev</text>
<g transform="translate(660 34) scale(1.85)"><rect x="0" y="8" width="44" height="58" rx="6" fill="#0B1626" stroke="#1B2B42" transform="rotate(-12 22 37)"/><rect x="10" y="4" width="44" height="58" rx="6" fill="#11203A" stroke="#1B2B42" transform="rotate(-2 32 33)"/><g transform="rotate(8 42 31)"><rect x="20" y="2" width="44" height="58" rx="6" fill="#142640" stroke="#8296AE" stroke-opacity=".6"/><rect x="27" y="10" width="30" height="16" rx="3" fill="#5CC8FF" fill-opacity=".85"/><rect x="27" y="32" width="28" height="3" rx="1.5" fill="#A3B4C9"/><rect x="27" y="39" width="22" height="3" rx="1.5" fill="#34496A"/><rect x="27" y="46" width="25" height="3" rx="1.5" fill="#34496A"/></g></g>
</svg>
